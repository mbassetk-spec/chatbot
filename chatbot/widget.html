<!-- Employee Report Assistant: widget markup only.
     Loaded by app.js into a Shadow DOM root; style.css is attached there too.
     No inline scripts or inline event handlers. -->
<div class="eac-root">
  <button type="button" class="eac-launcher" id="eac-launcher"
          aria-label="Open report assistant" aria-expanded="false" aria-controls="eac-panel" hidden>
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9.2l-4.1 3.4a.8.8 0 0 1-1.3-.6V17H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm3 4v2h10V8H7Zm0 4v2h6v-2H7Z"/>
    </svg>
  </button>

  <section class="eac-panel" id="eac-panel" role="dialog" aria-modal="false"
           aria-labelledby="eac-title" hidden>
    <header class="eac-header">
      <div class="eac-header__title">
        <span class="eac-status" id="eac-status" data-state="online" role="img" aria-label="Online"></span>
        <h2 class="eac-title" id="eac-title">Report Assistant</h2>
      </div>
      <div class="eac-header__actions">
        <button type="button" class="eac-icon-btn" id="eac-new" aria-label="Start a new conversation" title="New conversation">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg>
        </button>
        <button type="button" class="eac-icon-btn" id="eac-minimize" aria-label="Minimize" aria-pressed="false" title="Minimize">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M5 17h14v2H5z"/></svg>
        </button>
        <button type="button" class="eac-icon-btn" id="eac-close" aria-label="Close" title="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4 6.4 5Z"/></svg>
        </button>
      </div>
    </header>

    <div class="eac-content" id="eac-content">
      <div class="eac-body" id="eac-body" tabindex="-1">
        <div class="eac-welcome" id="eac-welcome">
          <h3 class="eac-welcome__heading">How can I help?</h3>
          <p class="eac-welcome__text" id="eac-welcome-text">
            Ask a question about the business reports available to your account.
          </p>
        </div>
        <ol class="eac-messages" id="eac-messages" role="log" aria-live="polite" aria-relevant="additions"></ol>
        <div class="eac-loading" id="eac-loading" hidden>
          <span class="eac-loading__dot"></span><span class="eac-loading__dot"></span><span class="eac-loading__dot"></span>
          <span class="eac-sr-only">The assistant is preparing an answer</span>
        </div>
      </div>

      <div class="eac-error" id="eac-error" role="alert" hidden>
        <span class="eac-error__text" id="eac-error-text"></span>
        <button type="button" class="eac-link-btn" id="eac-retry" hidden>Retry</button>
      </div>

      <form class="eac-form" id="eac-form" autocomplete="off" novalidate>
        <label class="eac-sr-only" for="eac-input">Message</label>
        <textarea class="eac-input" id="eac-input" rows="1" maxlength="2000"
                  placeholder="Ask about your reports…"></textarea>
        <button type="submit" class="eac-send" id="eac-send" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.3 10l12.6 2-12.6 2 .1 6.4Z"/></svg>
        </button>
      </form>
      <p class="eac-footnote">Answers come only from reports available to your account.</p>
    </div>
  </section>
</div>
